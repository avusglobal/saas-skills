name: Push Bug Analysis

# Project-agnostic. Requirements: the CLAUDE_CODE_OAUTH_TOKEN repository
# secret (generate with `claude setup-token`). Reports are written in
# English (kit-wide language policy) — swap the prompt's structure freely.
#
# Runs on every push to any branch and asks Claude to review the pushed
# changes for likely bugs. Results are posted as a comment on the open
# pull request for that branch (or, if none exists, as a commit comment).
#
# Uses claude-code-base-action (not claude-code-action) because the
# higher-level action only supports a fixed set of GitHub event types
# (issues, pull_request*, workflow_dispatch, repository_dispatch,
# schedule, workflow_run) and errors with "Unsupported event type: push"
# otherwise. base-action is event-agnostic: it just runs Claude Code with
# a prompt, so it works directly on `push` with no relay step, and the
# workflow file only needs to exist on whichever branch is pushed to
# (unlike repository_dispatch/workflow_dispatch, which only fire for
# workflow files present on the repository's default branch).
#
# Claude only ANALYZES: it reviews the diff and writes its findings to a
# report file. All GitHub plumbing (resolving the diff range, finding the
# PR, creating/updating the comment) happens in deterministic shell steps.
# Two reasons:
#   - Speed/correctness: when the agent posted the comment itself it spent
#     most of its turns fighting the Bash allowlist, and `gh api -f
#     body=@/tmp/file` posted the literal string "@/tmp/file" as the
#     comment (`-f/--raw-field` never reads files; only `-F/--field`
#     interprets `@path`). The publish step below uses `-F body=@file`.
#   - Security: the model never holds a GitHub token, so a malicious diff
#     can't prompt-inject it into making authenticated API calls.
on:
  push:
    branches: ["**"]

concurrency:
  group: push-bug-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # contents: write covers the commit-comment fallback; pull-requests: write
  # is needed to post an issue comment on the branch's open PR.
  contents: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Backstop only. The analyze step carries its own tighter timeout so
    # that when it stalls, the publish step still runs and leaves a visible
    # failure notice on the PR (a job-level timeout would kill that too).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so merge-base works on the first push of a branch.
          # On a small repo this costs ~1s; on a very large one, consider a
          # deep-but-bounded fetch instead.
          fetch-depth: 0

      - name: Resolve diff range
        id: range
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base=""
          if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            # First push of the branch (or a force-push whose old tip is
            # gone): diff against the merge-base with the default branch.
            base=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null || true)
          fi
          if [ -z "$base" ] || [ "$base" = "$HEAD_SHA" ]; then
            # Pushing the default branch itself with no usable before, or no
            # common history: fall back to the parent commit, or the empty
            # tree for a root commit (so the whole commit is reviewed).
            base=$(git rev-parse -q --verify "$HEAD_SHA^" 2>/dev/null \
              || git hash-object -t tree /dev/null)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Analyze changes for bugs
        id: analysis
        # Generous enough for a large diff near the max_turns cap; on
        # expiry only this step fails, so the publish step below still
        # posts a "did not complete" notice instead of silence.
        timeout-minutes: 14
        uses: anthropics/claude-code-base-action@beta
        with:
          # Billed against a Claude Pro/Max subscription's usage limits (not
          # per-token API billing). Generate this token with `claude setup-token`
          # and store it as the CLAUDE_CODE_OAUTH_TOKEN repository secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pin a model explicitly — action defaults have shipped retired
          # model IDs before (API 404).
          model: claude-sonnet-5
          # Analysis alone fits comfortably in this budget (plumbing-free
          # runs use ~15-25 turns); the cap only guards against runaways.
          max_turns: "50"
          prompt: |
            Run `git diff ${{ steps.range.outputs.base }} ${{ github.sha }}`
            in this repository to see the changes pushed to this branch
            (previous tip vs. new tip, or the merge-base with the default
            branch on a first push).

            Carefully review only the changed lines (plus enough surrounding
            context to understand them) for likely bugs: logic errors, off-by-one
            mistakes, incorrect null/undefined handling, race conditions, broken
            error handling, security issues (injection, XSS, auth bypass), and
            regressions relative to existing behavior.

            Write the report in English. Be direct: no filler,
            no hedging, no restating instructions. Use exactly this structure
            (GitHub-flavored Markdown):

            ## 🔎 Bug analysis — `<short-base>..<short-head>`

            **Verdict:** 🐛 <N> bug(s) found — or — ✅ No bugs found

            If there are bugs, add a summary table and then one section per
            bug, numbered to match the table:

            | # | Severity | File | Problem |
            |---|----------|------|---------|
            | 1 | high | `src/example.ts:42` | one-sentence summary |

            ### 1. <direct title> — `file:line`

            <1–3 sentences: what is wrong and why.>

            **Current code:**
            ```ts
            // only the relevant lines, as they appear in the diff
            ```

            **Suggested fix:**
            ```ts
            // the same lines, fixed
            ```

            **How to verify:** <test to add, reproduction case, or log to watch.>

            Severity scale: high = breaks functionality or security; medium =
            wrong behavior in plausible cases; low = edge case / robustness.
            When a short flow genuinely clarifies how a bug
            manifests (e.g. request → handler → invalid state), add a
            small `mermaid` `flowchart TD` code block inside that bug's
            section — only when it adds real clarity.

            If there are no bugs, after the verdict add a short section
            **What was checked** with 3–6 objective bullets (files and
            risks examined) — and nothing else.

            When you are done, use the Write tool to save the report to
            `${{ github.workspace }}/pr-bug-report.md`. A later workflow step
            publishes that file verbatim as the PR comment — do not try to
            post anything to GitHub yourself, and do not add any marker/HTML
            comment or footer; the publishing step handles those.
          allowed_tools: "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob,Write"

      - name: Publish report as PR or commit comment
        # Also runs when the analyze step failed or timed out (but not on
        # cancellation, e.g. a superseded push) so the PR shows an explicit
        # "did not complete" notice instead of a silence that could be
        # misread as "no bugs found".
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as env vars (not interpolated into the script text)
          # because branch names are attacker-controlled (push triggers on
          # branches: ["**"]) and can contain shell metacharacters like `` ` ``
          # or `$(...)`. Quoted variable expansion only ever substitutes their
          # value as inert data.
          BRANCH_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.sha }}
          DIFF_BASE: ${{ steps.range.outputs.base }}
          REPORT_FILE: ${{ github.workspace }}/pr-bug-report.md
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Single source of truth for the marker: prefixed to the comment
          # body here and passed to jq via --arg below to find the existing
          # comment to update on later pushes.
          marker='<!-- push-bug-analysis -->'
          body_file="$RUNNER_TEMP/pr-bug-comment.md"

          missing_report=""
          if [ "$ANALYSIS_OUTCOME" = "success" ] && [ ! -s "$REPORT_FILE" ]; then
            missing_report=1
          fi
          if [ "$ANALYSIS_OUTCOME" = "success" ] && [ -z "$missing_report" ]; then
            {
              echo "$marker"
              echo
              cat "$REPORT_FILE"
              # %.7s prints the short form of the two commit SHAs.
              printf '\n\n---\n<sub>🤖 Push Bug Analysis · diff `%.7s..%.7s` · [view run](%s)</sub>\n' \
                "$DIFF_BASE" "$HEAD_SHA" "$RUN_URL"
            } > "$body_file"
          else
            {
              printf '%s\n\n' "$marker"
              printf ':warning: Automated bug analysis **did not complete** for `%.7s` (analysis step outcome: `%s`%s).\n\n' \
                "$HEAD_SHA" "$ANALYSIS_OUTCOME" "${missing_report:+, report file missing}"
              printf 'This does **not** mean "no bugs were found" — see the [workflow run](%s) for details.\n' "$RUN_URL"
            } > "$body_file"
          fi

          # GitHub caps issue/commit comment bodies at 65536 characters.
          # Truncate in Python rather than `head -c | iconv -c`: decode with
          # errors="ignore" drops an incomplete trailing sequence when the
          # byte cut lands mid-way through a multi-byte UTF-8 character
          # (iconv -c exits 1 on exactly that input, which would kill this
          # step under pipefail).
          python3 - "$body_file" <<'PY'
          import sys
          path = sys.argv[1]
          data = open(path, "rb").read()
          if len(data) > 65000:
              text = data[:65000].decode("utf-8", errors="ignore")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text + "\n\n… (truncated)\n")
          PY

          # Find the open pull request whose head branch is $BRANCH_NAME.
          # The explicit `--method GET` matters: without it, `gh api`
          # silently switches to POST (the create-PR endpoint) whenever
          # field args are present.
          pr_number=$(gh api "repos/$REPO_OWNER/$REPO_NAME/pulls" \
            --method GET \
            --raw-field head="$REPO_OWNER:$BRANCH_NAME" \
            --raw-field state=open \
            --jq '.[0].number // empty')

          # `-F body=@file` (typed --field) reads the body from the file;
          # `-f/--raw-field` would post the literal string "@...".
          if [ -n "$pr_number" ]; then
            # Update the existing marker comment in place if there is one.
            # Plain jq instead of gh's --jq so the marker can be passed via
            # --arg (gh api has no --arg); sed -n 1p instead of head -1 to
            # avoid SIGPIPE under pipefail.
            comment_id=$(gh api \
              "repos/$REPO_OWNER/$REPO_NAME/issues/$pr_number/comments" \
              --paginate \
              | jq -r --arg marker "$marker" \
                  '[.[] | select(.body | startswith($marker))][0].id // empty' \
              | sed -n '1p')
            if [ -n "$comment_id" ]; then
              gh api --method PATCH \
                "repos/$REPO_OWNER/$REPO_NAME/issues/comments/$comment_id" \
                -F body=@"$body_file" --jq '.html_url'
            else
              gh api "repos/$REPO_OWNER/$REPO_NAME/issues/$pr_number/comments" \
                -F body=@"$body_file" --jq '.html_url'
            fi
          else
            gh api "repos/$REPO_OWNER/$REPO_NAME/commits/$HEAD_SHA/comments" \
              -F body=@"$body_file" --jq '.html_url'
          fi

          # The analyze step claimed success but never wrote the report:
          # the notice above was posted, but the run itself must stay red.
          if [ -n "$missing_report" ]; then
            echo "::error::Claude did not write a report to $REPORT_FILE"
            exit 1
          fi
