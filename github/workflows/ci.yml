name: CI

# Project-agnostic verify gate. Adapt the toolchain block and the three
# verify commands to your project; keep the shape (single blocking job,
# superseded runs cancelled, frozen lockfile).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gate: must be green to merge. Mirror your local pre-flight
  # (typecheck / lint / test) so CI and laptop never diverge — wire the
  # commands as package.json scripts and call the same scripts here.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain: keep exactly one of the blocks below ---
      # Bun (pin the version your project is tested against — a floating
      # "latest" has broken tooling before):
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      # Node alternative:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     cache: npm # or pnpm (add pnpm/action-setup first)

      # Install with a frozen lockfile so CI never drifts from the repo.
      # Running lint via the package script (not `bunx`/`npx`) resolves the
      # lockfile-pinned linter from node_modules — never a newer fetched one.
      - run: bun install --frozen-lockfile # or: npm ci

      - name: Typecheck
        run: bun run typecheck
      - name: Lint + format
        run: bun run lint
      - name: Tests
        run: bun run test
