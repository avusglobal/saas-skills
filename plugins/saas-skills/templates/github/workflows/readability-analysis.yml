name: Readability Analysis

# Asks Claude to review every pull request's diff against the saas-skills code
# standard — not bugs (push-bug-analysis.yml owns those). The criteria are NOT
# in this file: the job checks out the kit and reads the `code-standard` skill and its
# references, so the standard has exactly one source of truth and
# a rule added there is reviewed on the next pull request. Results are posted
# as a single PR comment that is updated in place on each push.
#
# Same architecture as push-bug-analysis.yml: Claude only analyzes and writes
# a report file; all GitHub plumbing is deterministic shell, and the model
# never holds a GitHub token (prompt-injection safe). Needs the
# CLAUDE_CODE_OAUTH_TOKEN repository secret (`claude setup-token`).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: readability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    if: '!github.event.pull_request.draft || github.event.action == ''ready_for_review'''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base diff below always resolves.
          fetch-depth: 0

      - name: Check out the saas-skills standard
        uses: actions/checkout@v4
        with:
          repository: gruporezult/saas-skills
          path: .saas-skills-standard
          # Deliberately tracks the kit's current standard: a rule added to a
          # skill starts being reviewed on the next pull request, while its
          # linter half only lands when the project runs /saas-skills:upgrade.

      - name: Resolve diff range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Diff from the merge-base so the report covers exactly what the PR
          # adds, even when base has moved on.
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Analyze changes for readability
        id: analysis
        timeout-minutes: 14
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-sonnet-5
          max_turns: "50"
          prompt: |
            The review standard is not in this prompt. Read it first, in full:

            - `.saas-skills-standard/plugins/saas-skills/skills/code-standard/SKILL.md`
              — the standard itself, plus every file in its `references/`:
              the design step (responsibilities, seams, SOLID, patterns), the
              dependency bar, and the frontend and backend deltas.
            - `.saas-skills-standard/plugins/saas-skills/skills/tdd/SKILL.md`
              — what the tests in this diff have to look like.

            Also read this repository's `AGENTS.md` — its capability table is
            what "the stack already does this" means here.

            Those files are the ONLY criteria. Do not invent a rule they do not
            state, and do not soften one they do. Every finding names the rule
            it violates, quoted from the skill.

            Then run
            `git diff ${{ steps.range.outputs.base }} ${{ github.event.pull_request.head.sha }}`
            to see everything this pull request changes, and review it against
            that standard. The bar the standard exists for: a solo developer
            who works on several projects opens this code TWO MONTHS from now,
            with no memory of it, and must understand it easily.

            Two things are out of scope:

            - **Rules marked ⚙ in the skill.** The linter and the typecheck
              already fail the build on those; repeating them here is noise.
            - **Bugs.** Another workflow owns them.

            Write the report in English. Be direct: no filler,
            no hedging. Use exactly this structure (GitHub-flavored Markdown):

            ## 📖 Code standard analysis

            **Verdict:** <grade A/B/C/D> — <one sentence: will this code be understandable two months from now?>

            If there are findings, add a summary table and one short section
            per finding, numbered to match:

            | # | Impact | File | Rule | Problem |
            |---|--------|------|------|---------|
            | 1 | high | `src/example.ts:42` | Name your conditions | one-sentence summary |

            ### 1. <direct title> — `file:line`

            <1–3 sentences: the rule it breaks, and why that hurts the future
            reader. Quote the rule.>

            **Suggestion:**
            ```ts
            // the same snippet, rewritten for readability
            ```

            Impact scale: high = the future reader will get lost or misread
            the code; medium = costs time and rereading; low = polish.
            Do not nitpick style the formatter already owns (indentation,
            quotes, import order). Never suggest a change the standard itself
            forbids — a speculative abstraction, a wrapper for one call site,
            a pattern for a pressure the diff does not show. Simpler and
            flatter wins.

            If the code meets the standard, after the verdict add a short
            section **What reads well** with 2–4 bullets naming the rules it
            follows well — and nothing else.

            When you are done, use the Write tool to save the report to
            `${{ github.workspace }}/readability-report.md`. A later workflow
            step publishes that file verbatim as the PR comment — do not post
            anything to GitHub yourself, and do not add any marker/HTML
            comment or footer; the publishing step handles those.
          allowed_tools: "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob,Write"

      - name: Publish report as PR comment
        # Also runs when the analyze step failed or timed out so the PR shows
        # an explicit notice instead of silence.
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_FILE: ${{ github.workspace }}/readability-report.md
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- readability-analysis -->'
          body_file="$RUNNER_TEMP/readability-comment.md"

          missing_report=""
          if [ "$ANALYSIS_OUTCOME" = "success" ] && [ ! -s "$REPORT_FILE" ]; then
            missing_report=1
          fi
          if [ "$ANALYSIS_OUTCOME" = "success" ] && [ -z "$missing_report" ]; then
            {
              echo "$marker"
              echo
              cat "$REPORT_FILE"
              printf '\n\n---\n<sub>🤖 Readability Analysis · `%.7s` · [view run](%s)</sub>\n' \
                "$HEAD_SHA" "$RUN_URL"
            } > "$body_file"
          else
            {
              printf '%s\n\n' "$marker"
              printf ':warning: Readability analysis **did not complete** for `%.7s` (outcome: `%s`%s). See the [workflow run](%s).\n' \
                "$HEAD_SHA" "$ANALYSIS_OUTCOME" "${missing_report:+, report file missing}" "$RUN_URL"
            } > "$body_file"
          fi

          # GitHub caps comment bodies at 65536 characters (see
          # push-bug-analysis.yml for why truncation happens in Python).
          python3 - "$body_file" <<'PY'
          import sys
          path = sys.argv[1]
          data = open(path, "rb").read()
          if len(data) > 65000:
              text = data[:65000].decode("utf-8", errors="ignore")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text + "\n\n… (truncated)\n")
          PY

          # Update the existing marker comment in place, or create it.
          comment_id=$(gh api \
            "repos/$REPO_OWNER/$REPO_NAME/issues/$PR_NUMBER/comments" \
            --paginate \
            | jq -r --arg marker "$marker" \
                '[.[] | select(.body | startswith($marker))][0].id // empty' \
            | sed -n '1p')
          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/$REPO_OWNER/$REPO_NAME/issues/comments/$comment_id" \
              -F body=@"$body_file" --jq '.html_url'
          else
            gh api "repos/$REPO_OWNER/$REPO_NAME/issues/$PR_NUMBER/comments" \
              -F body=@"$body_file" --jq '.html_url'
          fi

          if [ -n "$missing_report" ]; then
            echo "::error::Claude did not write a report to $REPORT_FILE"
            exit 1
          fi
