name: Format

# Auto-formats the code of every pull request and pushes the fixes back to
# the PR branch, so formatting never blocks a merge and never depends on the
# developer remembering to run the formatter.
#
# Caveats to know when adopting:
#   - Commits pushed with the default GITHUB_TOKEN do NOT retrigger workflows
#     (GitHub's recursion guard), so the auto-format commit itself won't get a
#     fresh CI run. Either keep `ci.yml`'s lint step tolerant of
#     formatting-only diffs, or use a PAT/GitHub App token here if you need CI
#     to re-run on the fix commit.
#   - Fork PRs are skipped (their branches can't be pushed to with this token).
on:
  pull_request:

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR HEAD branch itself (not the merge ref) so the
          # formatting commit can be pushed back to it.
          ref: ${{ github.head_ref }}

      # --- Toolchain: uncomment exactly one block and pin the version the
      # project is tested against (a floating "latest" has broken tooling
      # before). /saas-skills:setup picks it from the lockfile.
      # Node:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     cache: npm # or pnpm (add pnpm/action-setup first), or yarn
      # Bun:
      # - uses: oven-sh/setup-bun@v2
      #   with:
      #     bun-version: 1.3.8

      - run: <install command>

      # Wire `format` as a package script (e.g. `biome check --write .` or
      # `prettier --write .`) so laptop and CI run the identical command.
      - name: Format
        run: <format command>

      - name: Commit and push fixes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: auto-format"
          git push
