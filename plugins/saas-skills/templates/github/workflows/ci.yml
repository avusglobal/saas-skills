name: CI

# Project-agnostic verify gate. Adapt the toolchain block and the three
# verify commands to your project; keep the shape (single blocking job,
# superseded runs cancelled, frozen lockfile).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gate: must be green to merge. Mirror your local pre-flight
  # (typecheck / lint / test) so CI and laptop never diverge — wire the
  # commands as package.json scripts and call the same scripts here.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain: uncomment exactly one block and pin the version the
      # project is tested against (a floating "latest" has broken tooling
      # before). /saas-skills:setup picks it from the lockfile.
      # Node:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     cache: npm # or pnpm (add pnpm/action-setup first), or yarn
      # Bun:
      # - uses: oven-sh/setup-bun@v2
      #   with:
      #     bun-version: 1.3.8

      # Install with a frozen lockfile so CI never drifts from the repo
      # (`npm ci`, `pnpm install --frozen-lockfile`, `bun install
      # --frozen-lockfile`). Running lint via the package script (not
      # `npx`/`bunx`) resolves the lockfile-pinned linter from node_modules —
      # never a newer fetched one.
      - run: <install command>

      - name: Typecheck
        run: <typecheck command>
      - name: Lint + format
        run: <lint command>
      - name: Tests
        run: <test command>
